name = "ai-cover-letter-generator"
main = "src/index.js"
compatibility_date = "2026-09-27"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"
run_worker_first = ["/*"]

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }
